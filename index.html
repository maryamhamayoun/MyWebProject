<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      background: #f4f4f4;
      color: #333;
    }
    h1 { color: #4a90e2; }
    p { line-height: 1.6; }
    button {
      padding: 10px 20px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #357abd; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>This is a simple HTML page. Click the button below to see an alert.</p>
  <button onclick="alert('Button clicked!')">Click Me</button>
</body>
</html>
